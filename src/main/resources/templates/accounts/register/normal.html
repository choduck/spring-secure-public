<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: html(content=~{::content})}">
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">계좌정보</h5>
                <div>
                    <button class="btn btn-secondary">파일찾기</button>
                    <button class="btn btn-secondary">파일내리기</button>
                    <button class="btn btn-secondary">프린트</button>
                </div>
            </div>
            <div class="card-body">
                <div class="mb-3 d-flex justify-content-end">
                    <div class="btn-group">
                        <button id="registerBtn" class="btn btn-outline-secondary">등록</button>
                        <button class="btn btn-outline-secondary">수정</button>
                        <button class="btn btn-outline-secondary">삭제</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="bg-light">
                            <tr>
                                <th>
                                    <div class="checkbox-container">
                                        <input type="checkbox" class="form-check-input">
                                    </div>
                                </th>
                                <th>기업명</th>
                                <th>그룹명</th>
                                <th>금융사</th>
                                <th>과목명</th>
                                <th>통화</th>
                                <th>계좌번호</th>
                                <th>계좌별명</th>
                                <th>계정구분</th>
                                <th style="width: 80px">잔액</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="checkbox-container">
                                        <input type="checkbox" class="form-check-input">
                                    </div>
                                </td>
                                <td>(주)</td>
                                <td>111</td>
                                <td>하나은행</td>
                                <td>예금</td>
                                <td>KRW</td>
                                <td>12345123</td>
                                <td>모이모</td>
                                <td>수기전용계좌</td>
                                <td class="text-end">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="registerModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">수기계좌 등록</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="accountForm">
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">기업명</label>
                                <div class="col-sm-10">
                                    <select class="form-select">
                                        <option>(주)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">그룹명</label>
                                <div class="col-sm-10">
                                    <select class="form-select">
                                        <option>111</option>
                                        <option>222</option>
                                        <option>333</option>
                                        <option>444</option>
                                        <option>5555</option>
                                        <option>6666</option>
                                        <option>7777</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">금융사</label>
                                <div class="col-sm-10">
                                    <select class="form-select">
                                        <option>한국</option>
                                        <option>산업</option>
                                        <option>기업</option>
                                        <option>국민</option>
                                        <option>수협</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">통화구분</label>
                                <div class="col-sm-10">
                                    <select class="form-select">
                                        <option>원화(KRW)</option>
                                        <option>달러(USD)</option>
                                        <option>엔화(JPY)</option>
                                        <option>유로(EUR)</option>
                                        <option>위안(CNY)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">계좌번호</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">계좌별명</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">계정구분</label>
                                <div class="col-sm-10">
                                    <select class="form-select">
                                        <option>수기전용계좌</option>
                                        <option>일반계좌</option>
                                        <option>가상계좌</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">기간</label>
                                <div class="col-sm-10 d-flex">
                                    <input type="date" class="form-control me-2">
                                    <span class="align-self-center me-2">~</span>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary">저장</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-danger">삭제</button>
                    </div>
                </div>
            </div>
        </div>

        <style>
            .table th {
                background-color: #f8f9fa;
                font-weight: normal;
                text-align: center;
                vertical-align: middle;
                height: 45px;
            }
            .table td {
                text-align: center;
                vertical-align: middle;
                height: 45px;
            }
            .form-check-input {
                margin: 0;
                vertical-align: middle;
                position: static;
            }
            /* 체크박스 컬럼 스타일 */
            .table th:first-child,
            .table td:first-child {
                width: 50px;
                text-align: center;
                vertical-align: middle;
                padding: 0;
            }
            /* 체크박스 컨테이너 스타일 */
            .checkbox-container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
                padding: 0;
            }
            /* 모달 스타일 추가 */
            .modal-header {
                padding: 0.5rem 1rem;
            }
            .modal-title {
                font-size: 1rem;
            }
            .col-form-label {
                font-size: 0.9rem;
            }
        </style>

        <script type="text/javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // 전체 체크박스 처리
                document.querySelector('thead input[type="checkbox"]').addEventListener('change', function() {
                    var checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');
                    checkboxes.forEach(function(checkbox) {
                        checkbox.checked = this.checked;
                    }, this);
                });

                // 등록 버튼 클릭 시 모달 표시
                document.getElementById('registerBtn').addEventListener('click', function() {
                    var myModal = new bootstrap.Modal(document.getElementById('registerModal'));
                    myModal.show();
                });
            });
        </script>
    </div>
</body>
</html>
