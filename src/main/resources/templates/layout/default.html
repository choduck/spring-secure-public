<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>수기계좌관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <style>
        .wrapper {
            display: flex;
            width: 100%;
        }
        #sidebar {
            min-width: 250px;
            max-width: 250px;
            min-height: 100vh;
            background: #f8f9fa;
            color: #333;
            transition: all 0.3s;
        }
        #content {
            width: 100%;
            padding: 20px;
        }
        .sidebar-header {
            padding: 20px;
            background: #343a40;
            color: white;
        }
        .menu-item {
            padding: 10px 20px;
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: #333;
        }
        .menu-item:hover {
            background: #e9ecef;
            text-decoration: none;
            color: #333;
        }
        .list-unstyled {
            padding-left: 0;
            list-style: none;
        }
        .collapse {
            padding-left: 20px;
        }
        .collapse li {
            list-style: none;
        }
        .collapse a {
            display: block;
            padding: 8px 15px;
            color: #333;
            text-decoration: none;
        }
        .collapse a:hover {
            background: #e9ecef;
            text-decoration: none;
            color: #333;
        }
        .active {
            background: #e9ecef;
        }
        /* 화살표 아이콘 회전 */
        .menu-item[aria-expanded="true"] .fa-caret-right {
            transform: rotate(90deg);
        }
        /* 중첩된 메뉴 스타일 */
        #loanTypes {
            padding-left: 20px;
        }
        #loanTypes .menu-item {
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 사이드바 -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><a href="/accounts/manual" style="text-decoration: none; color: white; background-color: #343a40;">수기계좌관리</a></h3>
            </div>

            <ul class="list-unstyled components">
                <li>
                    <a class="menu-item" data-bs-toggle="collapse" href="#accountTypes" role="button" aria-expanded="false">
                        <i class="fas fa-caret-right"></i> 1. 수기계좌등록
                    </a>
                    <ul class="collapse" id="accountTypes">
                        <li><a href="/accounts/register/normal">일반계좌</a></li>
                        <li><a href="/accounts/register/securities">증권계좌</a></li>
                        <li>
                            <a class="menu-item" data-bs-toggle="collapse" href="#loanTypes" role="button" aria-expanded="false">
                                <i class="fas fa-caret-right"></i> 대출계좌
                            </a>
                            <ul class="collapse" id="loanTypes">
                                <li><a href="/accounts/register/loan/limit">한도등록</a></li>
                                <li><a href="/accounts/register/loan/execution">실행번호별 등록</a></li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li>
                    <a class="menu-item" data-toggle="collapse" href="#accountBalance" role="button" aria-expanded="false">
                        <i class="fas fa-caret-right"></i> 2. 수기계좌 잔액조회
                    </a>
                    <ul class="collapse" id="accountBalance">
                        <li><a href="/accounts/balance/normal">일반계좌</a></li>
                        <li><a href="/accounts/balance/securities">증권계좌</a></li>
                        <li><a href="/accounts/balance/loan">대출계좌</a></li>
                    </ul>
                </li>
                <li>
                    <a class="menu-item" href="/accounts/history">
                        <i class="fas fa-caret-right"></i> 3. 수기계좌 내역관리
                    </a>
                </li>
            </ul>
        </nav>

        <!-- 컨텐츠 영역 -->
        <div id="content">
            <div th:replace="${content}">
                <!-- 실제 컨텐츠가 여기에 들어갑니다 -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // 메뉴 아이템 클릭 시 화살표 아이콘 회전
            $('.menu-item').on('click', function() {
                $(this).find('.fa-caret-right').toggleClass('fa-rotate-90');
            });

            // 현재 URL에 따라 해당 메뉴 활성화 및 펼치기
            let currentUrl = window.location.pathname;
            let $activeLink = $('a[href="' + currentUrl + '"]');
            
            $activeLink.addClass('active');
            $activeLink.parents('.collapse').addClass('show');
            $activeLink.parents('li').find('.menu-item').attr('aria-expanded', 'true')
                .find('.fa-caret-right').addClass('fa-rotate-90');
        });
    </script>
</body>
</html>
